<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Position sweep: bottom-left</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background-color: #808080;  /* gray128, already characterized -- easy to tell apart from target */
  }
  .rect {
    position: absolute;
    width: 30%;
    height: 15%;
    background-color: #b43cdc;  /* rgb(180,60,220) -- Y=194 Co=216 Cg=244 */
    bottom: 0; left: 0;
  }
</style>
</head>
<body><div class="rect"></div></body>
</html>
